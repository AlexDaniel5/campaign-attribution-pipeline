name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}
      DUCKDB_PATH: ${{ github.workspace }}/warehouse.duckdb
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the DuckDB warehouse (synthetic raw data)
        run: python -m campaign_attribution.build_warehouse --db "$DUCKDB_PATH" --seed 42

      - name: dbt build (models + data-quality tests)
        run: dbt build

      - name: Run pytest (Python generator/loader suite)
        run: python -m pytest
